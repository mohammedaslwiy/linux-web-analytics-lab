services:
  db:
    image: docker.io/library/postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      TZ: UTC
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - lab_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${UMAMI_PORT:-9000}:3000"
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in .env}
      DISABLE_TELEMETRY: "1"
      TZ: UTC
    depends_on:
      db:
        condition: service_healthy
    networks:
      - lab_net

  website:
    image: docker.io/library/nginx:alpine
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-9090}:80"
    volumes:
      - ./html:/usr/share/nginx/html:ro
    networks:
      - lab_net

volumes:
  db_data:

networks:
  lab_net:
    driver: bridge
